apiVersion: apps/v1
kind: Deployment
metadata:
  name: <%k8s_name%>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <%k8s_name%>
  template:
    metadata:
      labels:
        app: <%k8s_name%>
    spec:
      containers:
      - name: <%k8s_name%>
        image: <%k8s_name%>:latest
        ports:
        - containerPort: 8501
---
apiVersion: v1
kind: Service
metadata:
  name: <%k8s_name%>
spec:
  selector:
    app: <%k8s_name%>
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
  type: LoadBalancer
