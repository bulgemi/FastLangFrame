services:
  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis-data:/data
    restart: unless-stopped

  authelia:
    image: authelia/authelia:4.37.5
    container_name: authelia
    volumes:
      - ./authelia/config:/config
    ports:
      - "9091:9091"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:
