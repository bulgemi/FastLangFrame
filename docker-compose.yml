services:
  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis-data:/data
    restart: unless-stopped

  authelia:
    image: authelia/authelia:4.38.10
    container_name: authelia
    volumes:
      - ./authelia/config:/config
    ports:
      - "9091:9091"
    depends_on:
      - redis
    # Secrets can be generated using: openssl rand -hex 32
    environment:
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=0aa061727320ad5522922606b34beadd5be6de5db23ce0cb778d1d82325cf2c9
      - AUTHELIA_SESSION_SECRET=afd4f9bc0a4cfcc2bc896315b55fe6efc82a31689b009a539c593518a1a107b6
      - AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET=c4a7b98248dbf5f6b5366993fe53bd5020fc1c8e4411dc24becfa88934f7abd8
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=fastlangframe1@
      - POSTGRES_DB=backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - authelia
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
