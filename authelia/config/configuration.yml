###############################################################
#                   Authelia Configuration                    #
###############################################################

server:
  address: 'tcp://0.0.0.0:9091/'

log:
  level: info

totp:
  issuer: Authelia

authentication_backend:
  file:
    path: /config/users_database.yml

access_control:
  default_policy: deny
  rules:
    - domain: "*"
      policy: bypass

session:
  name: authelia_session
  same_site: lax
  secret: unsecure_session_secret_change_me_at_least_32_chars
  expiration: 1h
  inactivity: 5m
  cookies:
    - domain: 'localhost'
      authelia_url: 'http://localhost:9091'
      default_redirection_url: 'http://localhost:8000'

storage:
  local:
    path: /config/db.sqlite3
  encryption_key: unsecure_storage_encryption_key_at_least_32_chars

notifier:
  filesystem:
    filename: /config/notification.txt

identity_validation:
  reset_password:
    jwt_secret: unsecure_reset_password_jwt_secret_at_least_32_chars

identity_providers:
  oidc:
    hmac_secret: unsecure_hmac_secret_change_me_at_least_32_chars
    jwks:
      - key: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA3/8V8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n
          8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n
          8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n
          8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n
          8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n
          8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n
          8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n8n
