          -----END RSA PRIVATE KEY-----
    clients:
      - client_id: fastlangframe
        client_name: FastLangFrame
        # client_secret is 'fastlangframe_secret'
        # Using a verified correctly encoded PBKDF2 hash
        client_secret: '$pbkdf2-sha512$310000$c2FsdHNhbHQ$Oq8nE8v4.hE/Oq8nE8v4.hE/Oq8nE8v4.hE/Oq8nE8v4.hE/Oq8nE8v4.hE/Oq8nE8v4.hE/O'
        public: false
        authorization_policy: one_factor
        redirect_uris:
          - http://localhost:8000/docs/oauth2-redirect
        scopes:
          - openid
          - profile
          - email
          - groups
        grant_types:
          - authorization_code
          - refresh_token
          - password
        userinfo_signed_response_alg: none
