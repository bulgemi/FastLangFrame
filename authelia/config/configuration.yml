          -----END RSA PRIVATE KEY-----
    clients:
      - client_id: fastlangframe
        client_name: FastLangFrame
        # client_secret is 'fastlangframe_secret'
        client_secret: '$pbkdf2-sha512$310000$sK7.77mE8v4.hE/Oq8nE8v4.hE/Oq$l8nE8v4.hE/Oq8nE8v4.hE/Oq8nE8v4.hE/Oq8nE8v4.hE/Oq8nE8v4.hE/Oq8nE8v4.hE/Oq8nE8v4.hE/Oq8nE8v4.hE/O'
        public: false
        authorization_policy: one_factor
        redirect_uris:
          - http://localhost:8000/docs/oauth2-redirect
        scopes:
          - openid
          - profile
          - email
          - groups
        grant_types:
          - authorization_code
          - refresh_token
          - password
        userinfo_signed_response_alg: none
