worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # HTTP to HTTPS redirect
    server {
        listen       80;
        server_name  127.0.0.1;
        return 301 https://$host$request_uri;
    }

    server {
        listen       8000 ssl;
        server_name  127.0.0.1;

        ssl_certificate      /etc/nginx/certs/server.crt;
        ssl_certificate_key  /etc/nginx/certs/server.key;

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;

        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        # Proxy to Backend (http://127.0.0.1:8888/)
        location / {
            # Authelia Redirect Correction: If rd parameter exists, redirect to /authelia/
            if ($arg_rd) {
                return 301 https://$http_host/authelia/?$args;
            }

            proxy_pass http://host.docker.internal:8888;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy to Authelia Portal
        location /authelia/ {
            proxy_pass http://authelia:9091/authelia/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-URI $request_uri;
        }

        # Authelia OIDC Endpoints
        location /api/oidc/ {
            proxy_pass http://authelia:9091/authelia/api/oidc/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-URI $request_uri;
        }

        # Authelia internal APIs
        location /api/auth {
            proxy_pass http://authelia:9091/authelia/api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
