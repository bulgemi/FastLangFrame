apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: research-agent
  template:
    metadata:
      labels:
        app: research-agent
    spec:
      containers:
        - name: research-agent
          image: research-agent:latest
          ports:
            - containerPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: research-agent
spec:
  selector:
    app: research-agent
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8888
  type: LoadBalancer
