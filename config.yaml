app:
    root_path: "/api/v1/agent"
    allowed_hosts:
        - "*"
        - "backend.default.svc.cluster.local"
    version: "${APP__VERSION}"
    locale: "en" # ko, en
    # log_level: debug  #
    profile: "development"
    log_level: "debug"
    static_dir: "static"
    auth_provider: "keycloak-builtin" # "keycloak", "keycloak-builtin"
    use_lineage: false
    fetch_mode_default: "lazy"
    domains:
        - tool
        - prompting
        - agent
        - common

projects:
    skon-multi-db:
        database: skon_db
        # opensearch: skon_opensearch
        # phoenix: skon_phenix

database:
    # driver: "mysql"  # posgresql=psycopg
    driver: "postgresql" # "postgresql-async"
    host: "${DATABASE__HOST}"
    port: "${DATABASE__PORT}"
    dbname: "${DATABASE__DBNAME}"
    username: "${DATABASE__USERNAME}"
    password: "${DATABASE__PASSWORD}"
    # schema: "${DATABASE__SCHEMA}"

    # # MYSQL
    echo: True
    echo_pool: False
    
    isolation_level: "Read committed"
    pool_reset_on_return: rollback # rollback, commit, None
    pool_timeout: 100
    pool_pre_ping: True
    pool_recycle: 1500
    pool_size: 5
    max_overflow: 10
    implicit_returning: True
    hide_parameters: False

    named:
        skon_db: 
            driver: "postgresql" # "postgresql-async"
            host: "${DATABASE__HOST}"
            port: 5433
            dbname: "${DATABASE__DBNAME}"
            username: "${DATABASE__USERNAME}"
            password: "${DATABASE__PASSWORD}"
            # schema: "skon_schema"

            # # MYSQL
            echo: True
            echo_pool: False
            isolation_level: "Read committed"
            pool_reset_on_return: rollback # rollback, commit, None
            pool_timeout: 100
            pool_pre_ping: True
            pool_recycle: 1500
            pool_size: 5
            max_overflow: 10
            implicit_returning: True
            hide_parameters: False

websocket:
    host: "http://localhost"
    port: 8080
    username: "admin" #"${ WEBSOCKET_USERNAME}"
    password: "admin" #"${ WEBSOCKET_PASSWORD}"

opensearch:
    server_type: "opensearch" 
    host: "localhost"
    port: 9200 
    username: "admin" 
    password: "Opensearch1!" 
    use_ssl: "false" 
    verify_certs: "false"
    ssl_show_warn: "false"
    pool_maxsize: 10
    timeout: 10
    named:
        # docker-compose `opensearch-secondary` (host 9201 -> container 9200)
        skon_opensearch:
            host: "localhost"
            port: 9201
            username: "admin"
            password: "Opensearch1!"
            timeout: 20
    use_flag:  "true" # true
    index_name_agent_tracing: agent-tracing
    index_name_agent_tool: agent-tool
