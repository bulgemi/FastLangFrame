llm:
    endpoint: "${GATEWAY_ENDPOINT}"
    apikey_url: "${GATEWAY_APIKEY_URL}"

retriever:  
    knowledge_queries_endpoint: "${KNOWLEDGE_QUERIES_ENDPOINT}"
    knowledge_repos_endpoint: "${KNOWLEDGE_REPOS_ENDPOINT}"
    knowledge_retrieval_info_endpoint: "${KNOWLEDGE_RETRIEVAL_INFO_ENDPOINT}"
    unique_check_key: chunk_id

redis:
    use_redis: false
    host: "${REDIS__HOST}" # localhost
    port: "${REDIS__PORT}" # 6379
    password: "${REDIS__PASSWORD}" # admin
    use_sentinel: "${REDIS__SENTINEL}"  # false
    master_name: "${REDIS__MASTER}"
    max_connections: 10
    cache_config_path: cache_config.yaml
    


phoenix:
    enabled: false
    endpoint: "http://aip.sktai.io/phoenix/v1/traces"
    graphql_endpoint: "http://aip.sktai.io/phoenix/graphql"
    verbose: false
    as_global: false
    phoenix_apikey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJBcGlLZXk6MiJ9.TtWHNsVA0iVhlqlId1r4I4wvg_DLrAXpBfwmw777ThI"

notification:
    queue_maxsize: 1000
    worker_count: 3
    shutdown_drain_timeout: 5
    queue_wait_warn_ms: 500
    semaphore_wait_warn_ms: 200
    opensearch_warn_ms: 1000
    redis_warn_ms: 500
    total_publish_warn_ms: 1500

